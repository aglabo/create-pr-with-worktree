# Exclude specific policies if needed
excludes:
  # policy 013: checkout_persist_credentials_should_be_false
  # Reason: These workflows run git push from within a worktree on the runner.
  # persist-credentials: true is required so the cloned repo retains credentials
  # for those push operations inside the worktree directory.
  - policy_name: checkout_persist_credentials_should_be_false
    workflow_file_path: .github/workflows/ru-fix-script-permissions.yml
    job_name: validate-permissions
  - policy_name: checkout_persist_credentials_should_be_false
    workflow_file_path: .github/workflows/test-create-pr.yml
    job_name: test-action

